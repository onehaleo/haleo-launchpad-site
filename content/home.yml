hero_headline: "AI you can trust with your clients."
hero_subheadline: "Your team is probably using AI already. I help small businesses in the Triangle put clear rules around it, choose tools that keep client information private, and train staff so the rules actually stick."
primary_cta_text: "Book a free AI Safety Check"
primary_cta_link: "/safety-check"
secondary_cta_text: "See what's included"
secondary_cta_link: "/services"
hero_trust_line: "One hour, in person or on Zoom. You keep the written summary whether or not we work together."
problem_section_title: "Sound like your office?"
problem_points:
  - "Someone pastes client emails into ChatGPT to draft replies, and nobody has said whether that's OK."
  - "You pay for one AI tool, but people use three free ones on their own."
  - "A client asked how you protect their information when you use AI, and there wasn't a written answer."
  - "You want the time savings but can't tell which tools keep data private."
before_after_title: "Before and after"
before_points:
  - "Each person decides what's safe to paste"
  - "Free tools with data policies nobody has read"
  - "No good answer when a client asks"
  - "AI use that nobody can see"
after_points:
  - "A one page policy everyone has read"
  - "An approved tools list that says what each tool is for"
  - "A short written answer you can send any client"
  - "One task automated, with a person checking the output"
services_section_title: "Ways to work together"
services_section_intro: "Most clients start with the free Safety Check. After that you only pay for what the check shows you need."
built_from_heading: "Who you'll work with"
built_from_body: "I'm Alexis Ortiz. I've spent five years at a large consulting firm, most recently on cybersecurity work where handling data carefully isn't optional. I also write software, so I can set up the tools as well as write the rules. I live in Durham and I'm happy to come to your office."
built_from_bullets:
  - "Cybersecurity and vulnerability research"
  - "Full stack development in React and Python"
  - "Workflow automation running in production"
  - "Computer science degree from UNC Chapel Hill"
  - "MBA in progress"
scope_section_title: "What you walk away with"
scope_bullets:
  - "A one page AI use policy written for your team"
  - "An approved tools list, with what each tool may and may not be used for"
  - "Plain rules for handling client information"
  - "A checklist for vetting any new AI tool"
  - "A one hour training session for your staff"
  - "A short answer you can give clients who ask how you use AI"
who_for_section_title: "Is Haleo a good fit?"
who_for_good_heading: "A good fit"
who_for_not_heading: "Probably not a fit"
who_for_good:
  - "Teams of about 5 to 50 people"
  - "Firms that hold confidential client information, like accounting, insurance, legal and property management offices"
  - "Owners who want their team using AI more, not banning it"
  - "Businesses around Raleigh, Durham and Chapel Hill (remote works too)"
who_for_not:
  - "Companies that need a formal compliance audit or a legal opinion. I'll point you to an attorney."
  - "Large organizations with their own security team"
  - "Anyone hoping to replace their staff with AI"
process_title: "How it works"
process_steps:
  - title: "Book the free Safety Check"
    description: "A one hour conversation, in person or on Zoom. We go through which AI tools your team uses, where client information ends up, and what worries you."
  - title: "Get your written summary"
    description: "Within two business days you'll get your top three risks and three quick fixes on one page. It's yours to keep either way."
  - title: "Fix what matters"
    description: "If you'd like help, I'll send a fixed price proposal. Most Starter packages take two to three weeks and one team meeting."
final_cta_headline: "Start with a free AI Safety Check"
final_cta_subheadline: "One hour, a one page summary of what to fix, and no obligation."
final_cta_text: "Book your Safety Check"
final_cta_link: "/safety-check"
