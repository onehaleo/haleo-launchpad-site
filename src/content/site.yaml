services:
  title: "What We Build"
  description: "Three services, one philosophy — you should own your systems outright and stop paying monthly for tools that half-work."
  items:
    - title: "Workflow & Process Automation"
      subtitle: "Replace manual work with systems that run themselves."
      description: "We replace manual, repetitive work with automated systems that run on real data. Get hours back every week, fewer errors, and a process that doesn't depend on someone remembering to do it."
      features:
        - "Replace spreadsheet-driven manual processes"
        - "Automated data intake, routing, and output"
        - "API integrations between your existing tools"
        - "Trigger-based notifications and task creation"
        - "Built with n8n, Make, or Python depending on scope"
      platforms: "n8n, Make.com, Python, REST APIs, Airtable"
      testimonial: ""
      cta: "Start with automation"

    - title: "Custom Web App Development"
      subtitle: "One tool built for how you actually work."
      description: "We build internal tools and multi-user apps for teams that are duct-taping together three SaaS tools and still falling short. One custom system, one flat fee, no monthly subscriptions, no paying for seats you don't use."
      features:
        - "Multi-user internal dashboards and ops tools"
        - "Custom data models built around your workflows"
        - "Role-based access and permissions"
        - "API integrations with your existing stack"
        - "Replaces your SaaS subscription stack permanently"
      platforms: "React, Node.js, Python, REST APIs"
      testimonial: ""
      cta: "Tell us what you need"

    - title: "Website Builds"
      subtitle: "Clean, fast, and free to host forever."
      description: "Clean, fast websites for service businesses that need a professional presence without ongoing hosting costs. For static sites, we host on GitHub Pages — free forever, no Squarespace bill, no Webflow subscription."
      features:
        - "Clean, professional single or multi-page sites"
        - "Free GitHub Pages hosting option (no monthly bills)"
        - "Fast load times, mobile-ready"
        - "Working contact and inquiry flows"
        - "You own everything outright"
      platforms: "HTML/CSS/JS, React, GitHub Pages"
      testimonial: ""
      cta: "Get a site that's yours"

why_haleo:
  title: "You don't need more subscriptions. You need a system that's actually yours."
  intro: "Most small teams are running on a patchwork of SaaS tools, manual reminders, and spreadsheets held together with hope. You're not disorganized — your systems just haven't been built yet."
  subtitle: "That's where we come in."
  features:
    - title: "Technical translator"
      icon: "🧠"
      description: "We bridge the gap between what your team actually does and what your systems support. We'll figure out what to build with you, not just hand you a spec sheet."

    - title: "Flat fee, no surprises"
      icon: "💰"
      description: "Every project starts with a clear scope and a cost estimate. You know what you're paying before anything gets built. No hourly overruns, no retainer traps."

    - title: "You own it outright"
      icon: "🔑"
      description: "Everything we build is yours. No vendor lock-in, no platform dependency. If we build it on open-source tools, it stays open. If it lives on GitHub Pages, it's free forever."

    - title: "Built for small operational teams"
      icon: "🤝"
      description: "We work best with teams of 1 to 20 people who know something is broken but aren't sure what to build. We'll figure that out with you and deliver something your whole team can use from day one."

  testimonial: ""
  conclusion: "Small teams deserve systems that actually work. Let's build the infrastructure your operation actually needs."

about:
  title: "About Haleo"
  intro: "We started Haleo because the teams that need good systems the most are usually the ones who can't afford an enterprise solution or an in-house engineer."
  background: "Haleo is led by Alexis. We've spent 5+ years building data pipelines, automation systems, and internal tools for federal technology clients — the kind of work where the stakes are high and the systems have to actually hold. We work best as technical translators: we take the messy gap between how your team operates and how your tools work, and turn it into something clean, automated, and usable."
  founding: "Haleo is the practice we built to bring that same quality of systems thinking to small teams and service businesses — without the enterprise price tag."
  services:
    - "Workflow and process automation that eliminates manual work"
    - "Custom internal web apps that replace your SaaS subscription stack"
    - "Clean websites with free hosting options"
  beliefs:
    - "Flat fees over hourly surprises"
    - "You should own your systems outright"
    - "Simple is better than clever"
    - "Build it once, use it forever"
  mission: "Whether you need a workflow automated, an internal tool built from scratch, or a site that costs nothing to host, the goal is the same: give your team back time and eliminate the monthly subscription creep."
  conclusion: "Let's build something that actually works."

